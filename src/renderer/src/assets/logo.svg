<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Serial Monitor Pro</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3d6b"/>
      <stop offset="1" stop-color="#0b1426"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8bd6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#1e3a66" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1b33"/>
      <stop offset="1" stop-color="#091224"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#glow)"/>
  <rect x="70" y="70" width="884" height="884" rx="202" fill="none" stroke="url(#rim)" stroke-width="12"/>

  <!-- Monitor -->
  <rect x="190" y="196" width="644" height="452" rx="44" fill="url(#bezel)"/>
  <rect x="208" y="214" width="608" height="416" rx="30" fill="url(#screen)"/>

  <!-- Window buttons -->
  <rect x="246" y="250" width="48" height="48" rx="13" fill="#ef4444"/>
  <rect x="312" y="250" width="48" height="48" rx="13" fill="#f59e0b"/>
  <rect x="378" y="250" width="48" height="48" rx="13" fill="#22c55e"/>

  <!-- Prompt  >_  -->
  <path d="M254 346 L304 378 L254 410" fill="none" stroke="#34d399" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="322" y="398" width="62" height="22" rx="11" fill="#34d399"/>

  <!-- Data lines -->
  <rect x="246" y="462" width="356" height="20" rx="10" fill="#cbd5e1"/>
  <rect x="628" y="462" width="148" height="20" rx="10" fill="#5eead4"/>
  <rect x="246" y="512" width="356" height="20" rx="10" fill="#94a3b8"/>
  <rect x="628" y="512" width="148" height="20" rx="10" fill="#5eead4" fill-opacity="0.75"/>
  <rect x="246" y="562" width="300" height="20" rx="10" fill="#cbd5e1"/>
  <rect x="628" y="562" width="148" height="20" rx="10" fill="#5eead4"/>

  <!-- Connector strip -->
  <rect x="300" y="648" width="424" height="26" rx="8" fill="#1d4ed8"/>
  <g fill="url(#pin)">
    <rect x="320" y="674" width="34" height="96" rx="10"/>
    <rect x="390" y="674" width="34" height="96" rx="10"/>
    <rect x="460" y="674" width="34" height="96" rx="10"/>
    <rect x="530" y="674" width="34" height="96" rx="10"/>
    <rect x="600" y="674" width="34" height="96" rx="10"/>
    <rect x="670" y="674" width="34" height="96" rx="10"/>
  </g>
  <g fill="#0b1426" fill-opacity="0.55">
    <rect x="328" y="742" width="18" height="16" rx="4"/>
    <rect x="398" y="742" width="18" height="16" rx="4"/>
    <rect x="468" y="742" width="18" height="16" rx="4"/>
    <rect x="538" y="742" width="18" height="16" rx="4"/>
    <rect x="608" y="742" width="18" height="16" rx="4"/>
    <rect x="678" y="742" width="18" height="16" rx="4"/>
  </g>

  <!-- TX / RX activity LEDs -->
  <rect x="196" y="816" width="104" height="30" rx="15" fill="#34d399"/>
  <rect x="724" y="816" width="104" height="30" rx="15" fill="#f87171"/>
</svg>
