version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # Families that only work in matching versions arrive together, major
      # updates included – vite 8 alone fails because electron-vite 5 and
      # @vitejs/plugin-react 5 pin older versions, vitest 5 needs coverage-v8 5.
      vite:
        patterns: ['vite', 'electron-vite', '@vitejs/*']
      vitest:
        patterns: ['vitest', '@vitest/*']
      typescript:
        patterns: ['typescript', 'typescript-eslint', '@typescript-eslint/*']
      # Other minor and patch updates arrive together; every other major update
      # gets its own pull request, so one blocked major cannot hold back the rest.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # The type definitions follow the oldest supported Node.js version
      # ("engines" in package.json), not the newest one.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
