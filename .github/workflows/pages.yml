name: Website

# Builds the project website from site/ (plus the pictures in docs/images and
# assets/brand) and publishes it with GitHub Pages:
# https://ujap1994.github.io/Serial-Monitor-Pro/
#
# One-time setup in the repository: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Pull requests only build the website; it is
# published from main. The download links come from the latest release when the
# page is opened, so a new release needs no new deployment.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/images/**'
      - 'assets/brand/**'
      - 'scripts/build-site.mjs'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/images/**'
      - 'assets/brand/**'
      - 'scripts/build-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build into dist/site
        run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
