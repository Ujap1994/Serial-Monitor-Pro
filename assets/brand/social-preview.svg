<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1d36"/>
      <stop offset="1" stop-color="#070d1a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.27" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e3a5f" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#page)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#halo)"/>
  <g transform="translate(96 140) scale(0.352)">
  
  <defs>
    <linearGradient id="l-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3d6b"/>
      <stop offset="1" stop-color="#0b1426"/>
    </linearGradient>
    <linearGradient id="l-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8bd6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#1e3a66" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="l-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1b33"/>
      <stop offset="1" stop-color="#091224"/>
    </linearGradient>
    <linearGradient id="l-bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="l-pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="l-glow" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#l-bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#l-glow)"/>
  <rect x="70" y="70" width="884" height="884" rx="202" fill="none" stroke="url(#l-rim)" stroke-width="12"/>

  <!-- Monitor -->
  <rect x="190" y="196" width="644" height="452" rx="44" fill="url(#l-bezel)"/>
  <rect x="208" y="214" width="608" height="416" rx="30" fill="url(#l-screen)"/>

  <!-- Window buttons -->
  <rect x="246" y="250" width="48" height="48" rx="13" fill="#ef4444"/>
  <rect x="312" y="250" width="48" height="48" rx="13" fill="#f59e0b"/>
  <rect x="378" y="250" width="48" height="48" rx="13" fill="#22c55e"/>

  <!-- Prompt  >_  -->
  <path d="M254 346 L304 378 L254 410" fill="none" stroke="#34d399" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="322" y="398" width="62" height="22" rx="11" fill="#34d399"/>

  <!-- Data lines -->
  <rect x="246" y="462" width="356" height="20" rx="10" fill="#cbd5e1"/>
  <rect x="628" y="462" width="148" height="20" rx="10" fill="#5eead4"/>
  <rect x="246" y="512" width="356" height="20" rx="10" fill="#94a3b8"/>
  <rect x="628" y="512" width="148" height="20" rx="10" fill="#5eead4" fill-opacity="0.75"/>
  <rect x="246" y="562" width="300" height="20" rx="10" fill="#cbd5e1"/>
  <rect x="628" y="562" width="148" height="20" rx="10" fill="#5eead4"/>

  <!-- Connector strip -->
  <rect x="300" y="648" width="424" height="26" rx="8" fill="#1d4ed8"/>
  <g fill="url(#l-pin)">
    <rect x="320" y="674" width="34" height="96" rx="10"/>
    <rect x="390" y="674" width="34" height="96" rx="10"/>
    <rect x="460" y="674" width="34" height="96" rx="10"/>
    <rect x="530" y="674" width="34" height="96" rx="10"/>
    <rect x="600" y="674" width="34" height="96" rx="10"/>
    <rect x="670" y="674" width="34" height="96" rx="10"/>
  </g>
  <g fill="#0b1426" fill-opacity="0.55">
    <rect x="328" y="742" width="18" height="16" rx="4"/>
    <rect x="398" y="742" width="18" height="16" rx="4"/>
    <rect x="468" y="742" width="18" height="16" rx="4"/>
    <rect x="538" y="742" width="18" height="16" rx="4"/>
    <rect x="608" y="742" width="18" height="16" rx="4"/>
    <rect x="678" y="742" width="18" height="16" rx="4"/>
  </g>

  <!-- TX / RX activity LEDs -->
  <rect x="196" y="816" width="104" height="30" rx="15" fill="#34d399"/>
  <rect x="724" y="816" width="104" height="30" rx="15" fill="#f87171"/>
</g>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="510" y="262" font-size="74" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">Serial Monitor Pro</text>
    <text x="512" y="320" font-size="29" font-weight="500" fill="#93c5fd">The modern serial terminal for makers,</text>
    <text x="512" y="360" font-size="29" font-weight="500" fill="#93c5fd">service and test engineering.</text>
    <g font-size="21" font-weight="600">
      <rect x="512" y="410" width="290" height="44" rx="22" fill="#1e3a8a" fill-opacity="0.65" stroke="#3b82f6" stroke-opacity="0.6"/>
      <text x="657" y="439" text-anchor="middle" fill="#dbeafe">Windows · macOS · Linux</text>
      <rect x="816" y="410" width="168" height="44" rx="22" fill="#064e3b" fill-opacity="0.65" stroke="#10b981" stroke-opacity="0.6"/>
      <text x="900" y="439" text-anchor="middle" fill="#d1fae5">x64 · arm64</text>
      <rect x="998" y="410" width="222" height="44" rx="22" fill="#4c1d95" fill-opacity="0.55" stroke="#8b5cf6" stroke-opacity="0.6"/>
      <text x="1109" y="439" text-anchor="middle" fill="#ede9fe">Open Source · MIT</text>
    </g>
    <text x="512" y="520" font-family="'JetBrains Mono', Consolas, monospace" font-size="19" fill="#64748b">HEX · Frames · CRC · Modbus · NMEA · Graphs · Scripts</text>
  </g>
</svg>
